# HOST: replace this with private random text, then give the exact same value to your friend.
sessionKey=CHANGE_ME_TO_THE_SAME_LONG_RANDOM_VALUE

mode=host
peerPort=32971
localPort=32970

# HollowKnight or Silksong. Your friend starts in the other game.
initialGame=HollowKnight
focusWindows=true

# Fail safe if a transfer/load stalls or the Hamachi peer goes silent.
exchangeTimeoutSeconds=180
peerTimeoutSeconds=30
