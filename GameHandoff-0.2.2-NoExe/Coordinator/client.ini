# CLIENT: use exactly the same private random text as the host.
sessionKey=CHANGE_ME_TO_THE_SAME_LONG_RANDOM_VALUE

mode=client

# Replace this with the host's Hamachi IPv4 address (usually 25.x.x.x).
peerAddress=25.0.0.1
peerPort=32971
localPort=32970
focusWindows=true

# Fail safe if a transfer/load stalls or the Hamachi peer goes silent.
exchangeTimeoutSeconds=180
peerTimeoutSeconds=30
